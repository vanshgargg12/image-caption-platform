server.port=${BACKEND_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Local Development Configuration (In-Memory H2 Database in PostgreSQL Compatibility Mode)
spring.datasource.url=jdbc:h2:mem:image_caption;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Flyway Migrations for Local H2
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart Upload Limits (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Internal Inference Service Client
inference.base-url=${INFERENCE_BASE_URL:http://localhost:3001}
inference.client.connect-timeout-ms=5000
inference.client.read-timeout-ms=30000
inference.client.max-retries=2

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
