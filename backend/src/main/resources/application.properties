server.port=${BACKEND_PORT:8080}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# Database Configuration (PostgreSQL default, H2 fallback profile)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/image_caption}
spring.datasource.username=${POSTGRES_USER:image_caption}
spring.datasource.password=${POSTGRES_PASSWORD:change-me}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway Migrations
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Multipart Upload Limits (10MB)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Internal Inference Service Client
inference.base-url=${INFERENCE_BASE_URL:http://localhost:3001}
inference.client.connect-timeout-ms=5000
inference.client.read-timeout-ms=30000
inference.client.max-retries=2

# CORS Configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# OpenAPI / Swagger Configuration
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
