version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: image-caption-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-image_caption}
      POSTGRES_USER: ${POSTGRES_USER:-image_caption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - caption_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-image_caption} -d $${POSTGRES_DB:-image_caption}"]
      interval: 5s
      timeout: 3s
      retries: 10

  inference:
    build:
      context: ../inference
      dockerfile: Dockerfile
    container_name: image-caption-inference
    restart: unless-stopped
    environment:
      INFERENCE_PORT: 3001
      MODEL_CACHE_DIR: /app/.cache
      MODEL_ID: Xenova/vit-gpt2-image-captioning
      MODEL_REVISION: main
    volumes:
      - huggingface_cache:/app/.cache
    networks:
      - caption_network
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/internal/ready || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 30

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: image-caption-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      BACKEND_PORT: 8080
      DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-image_caption}
      POSTGRES_USER: ${POSTGRES_USER:-image_caption}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      INFERENCE_BASE_URL: http://inference:3001
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    networks:
      - caption_network
    depends_on:
      postgres:
        condition: service_healthy
      inference:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 15s
      retries: 10

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8080}
    container_name: image-caption-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    networks:
      - caption_network
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000 || exit 1"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 5

networks:
  caption_network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  huggingface_cache:
    driver: local
